apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pds

resources:
  # Namespace
  - base/namespace.yaml

  # Configuration
  - base/configmap.yaml
  - base/secrets.yaml

  # Infrastructure
  - infrastructure/mysql.yaml
  - infrastructure/redis.yaml
  - infrastructure/keycloak.yaml

  # Core Services (start first)
  - base/config-service.yaml
  - base/discovery-service.yaml

  # Application Services
  - base/gateway-service.yaml
  - base/auth-service.yaml
  - base/clinic-service.yaml
  - base/medical-service.yaml
  - base/consultation-service.yaml

  # Frontend
  - base/frontend.yaml

  # Networking
  - infrastructure/ingress.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: pds-ehealth
  environment: production
