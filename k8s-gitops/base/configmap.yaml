apiVersion: v1
kind: ConfigMap
metadata:
  name: pds-config
  namespace: pds
  labels:
    app.kubernetes.io/name: pds-config
    app.kubernetes.io/part-of: pds-ehealth
data:
  # Database Configuration
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "pds_db"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Keycloak Configuration
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "pds-realm"
  KEYCLOAK_CLIENT_ID: "pds-client"

  # Service URLs (internal)
  CONFIG_SERVER_URL: "http://config-service:8888"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka/"

  # Spring Profiles
  SPRING_PROFILES_ACTIVE: "kubernetes"

  # Logging
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pds-service-urls
  namespace: pds
  labels:
    app.kubernetes.io/name: pds-service-urls
    app.kubernetes.io/part-of: pds-ehealth
data:
  AUTH_SERVICE_URL: "http://auth-service:8082"
  CLINIC_SERVICE_URL: "http://clinic-service:8083"
  MEDICAL_SERVICE_URL: "http://medical-service:8084"
  CONSULTATION_SERVICE_URL: "http://consultation-service:8085"
  GATEWAY_URL: "http://gateway-service:8081"
