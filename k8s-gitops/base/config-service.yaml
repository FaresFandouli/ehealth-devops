apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: pds
  labels:
    app: config-service
    app.kubernetes.io/name: config-service
    app.kubernetes.io/part-of: pds-ehealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: ${DOCKERHUB_USERNAME}/pds-config-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: pds-config
            - secretRef:
                name: pds-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 30
      imagePullSecrets:
        - name: docker-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: pds
  labels:
    app: config-service
spec:
  selector:
    app: config-service
  ports:
    - port: 8888
      targetPort: 8888
      name: http
  type: ClusterIP
