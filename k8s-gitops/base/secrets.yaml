apiVersion: v1
kind: Secret
metadata:
  name: pds-secrets
  namespace: pds
  labels:
    app.kubernetes.io/name: pds-secrets
    app.kubernetes.io/part-of: pds-ehealth
type: Opaque
stringData:
  # MySQL Credentials
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_USER: "pds_user"
  MYSQL_PASSWORD: "pds_password"

  # Keycloak Credentials
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  KC_DB_PASSWORD: "keycloak"

  # Redis Password (if needed)
  REDIS_PASSWORD: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: pds
  labels:
    app.kubernetes.io/name: docker-registry-secret
    app.kubernetes.io/part-of: pds-ehealth
type: kubernetes.io/dockerconfigjson
data:
  # Replace with your base64 encoded Docker Hub credentials
  # Generate with: kubectl create secret docker-registry docker-registry-secret --docker-server=https://index.docker.io/v1/ --docker-username=<username> --docker-password=<token> --docker-email=<email> --dry-run=client -o yaml
  .dockerconfigjson: eyJhdXRocyI6e319
