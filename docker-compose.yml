services:
  mysql:
    image: mysql:8.0
    container_name: pds-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pds_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pds-network

  redis:
    image: redis:7-alpine
    container_name: pds-redis
    ports:
      - "6379:6379"
    networks:
      - pds-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pds-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pds-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pds-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - pds-network

volumes:
  mysql_data:

networks:
  pds-network:
    driver: bridge