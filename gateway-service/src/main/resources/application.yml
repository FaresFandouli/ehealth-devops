server:
  port: 8982

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0  # ✅ Ne supprime rien, garde /api/auth intact

        - id: clinic-service
          uri: lb://clinic-service
          predicates:
            - Path=/api/clinic/**
          filters:
            - StripPrefix=0  # ✅ Ne supprime rien, garde /api/clinic intact

        - id: medical-service
          uri: lb://medical-service
          predicates:
            - Path=/api/medical/**
          filters:
            - StripPrefix=0  # ✅ Ne supprime rien, garde /api/medical intact

        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/consultation/**
          filters:
            - StripPrefix=0  # ✅ Ne supprime rien, garde /api/consultation intact

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:8082"
              - "http://localhost:8982"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

      # ✅ AJOUTÉ - Active la découverte des services
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true  # ✅ AJOUTÉ
    register-with-eureka: true  # ✅ AJOUTÉ
  instance:
    prefer-ip-address: true  # ✅ AJOUTÉ

management:
  endpoints:
    web:
      exposure:
        include: '*'