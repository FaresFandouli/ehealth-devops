server:
  port: 8081

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0  # ✅ AJOUTÉ - Ne supprime aucun préfixe

        - id: clinic-service
          uri: lb://clinic-service
          predicates:
            - Path=/api/clinic/**
          filters:
            - StripPrefix=0  # ✅ AJOUTÉ - Garde /api/clinic dans l'URL

        - id: medical-service
          uri: lb://medical-service
          predicates:
            - Path=/api/medical/**
          filters:
            - StripPrefix=0  # ✅ AJOUTÉ

        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/consultation/**
          filters:
            - StripPrefix=0  # ✅ AJOUTÉ

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

      # ✅ AJOUTÉ - Active la découverte des services
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true  # ✅ AJOUTÉ
    register-with-eureka: true  # ✅ AJOUTÉ
  instance:
    prefer-ip-address: true  # ✅ AJOUTÉ

management:
  endpoints:
    web:
      exposure:
        include: '*'